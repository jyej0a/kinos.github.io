<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="게시글 상세">
    <title>Dark Green Blog</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">

    <!-- Fonts -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/font-nanumlight/1.0/NanumBarunGothicWeb.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="blog-title">
                    <a href="index.html">🌿 Dark Green Blog</a>
                </h1>
                <div class="header-controls">
                    <button id="themeToggle" class="theme-toggle" aria-label="테마 전환">
                        🌙
                    </button>
                </div>
            </div>
        </header>

        <!-- Post Content -->
        <main class="post-content">
            <article class="post-article">
                <!-- Post Header -->
                <header class="post-header">
                    <h1 id="postTitle" class="post-title"></h1>
                    <div class="post-meta">
                        <time id="postDate" class="post-date"></time>
                        <span class="post-category" id="postCategory"></span>
                    </div>
                    <div class="post-tags" id="postTags"></div>
                </header>

                <!-- Post Body -->
                <div id="postBody" class="post-body"></div>

                <!-- Post Navigation -->
                <nav class="post-navigation">
                    <a href="index.html" class="nav-button">← 목록으로</a>
                </nav>
            </article>

            <!-- Giscus Comments -->
            <section id="comments" class="comments-section"></section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2025 Dark Green Blog. All rights reserved.</p>
            <p>
                Powered by
                <a href="https://pages.github.com/" target="_blank"> Universitas Pages</a>
            </p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/post-loader.js"></script>
</body>

</html>
