<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="다크 그린 테마의 미니멀 블로그">
    <title>영쓰 Blog</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">

    <!-- Fonts -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/font-nanumlight/1.0/NanumBarunGothicWeb.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="blog-title">
                    <a href="index.html">🌿 영쓰 Blog</a>
                </h1>
                <div class="header-controls">
                    <div class="search-container">
                        <input type="text" id="searchInput" class="search-input" placeholder="검색..." autocomplete="off">
                        <div id="searchResults" class="search-results"></div>
                    </div>
                    <button id="themeToggle" class="theme-toggle" aria-label="테마 전환">
                        🌙
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Sidebar -->
            <aside class="sidebar">
                <section class="sidebar-section">
                    <h2>카테고리</h2>
                    <div id="categoryFilter" class="filter-list"></div>
                </section>

                <section class="sidebar-section">
                    <h2>태그</h2>
                    <div id="tagCloud" class="tag-cloud"></div>
                </section>
            </aside>

            <!-- Post List -->
            <section class="post-list" id="postList">
                <div class="loading">게시글을 불러오는 중...</div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2025 Dark Green Blog. All rights reserved.</p>
            <p>
                Powered by
                <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>
            </p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/search.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
